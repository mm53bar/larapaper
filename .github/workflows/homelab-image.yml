name: Homelab image

on:
  push:
    branches: [homelab]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'mm53bar/larapaper'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: echo "VERSION=$(git describe --tags --abbrev=0)-homelab.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          target: production
          tags: |
            ghcr.io/mm53bar/larapaper:homelab
            ghcr.io/mm53bar/larapaper:homelab-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mm53bar/larapaper
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
